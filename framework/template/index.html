<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF7EB;
    --card:#FFFDF7;
    --ink:#43301F;
    --soft:#8A7256;
    --line:#E8D9C2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Quicksand","Trebuchet MS",sans-serif;
    color:var(--ink);background:var(--paper);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  header{padding:12px 18px 4px;background:var(--paper);z-index:1200;text-align:center;}
  header h1{
    font-family:"Caveat",cursive;font-weight:700;
    font-size:1.9rem;line-height:1;letter-spacing:.01em;
  }
  header h1 .heart{color:var(--accent,#C94F4F);}
  header p{font-size:.78rem;color:var(--soft);margin-top:2px;}
  .tabs{
    display:flex;gap:8px;justify-content:flex-start;
    padding:10px 14px 12px;background:var(--paper);z-index:1200;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .tab{
    flex:0 0 auto;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;
    background:var(--card);color:var(--ink);
    border:1.5px dashed var(--c);border-radius:10px;
    padding:7px 13px;display:flex;align-items:center;gap:7px;
    transform:rotate(-.6deg);transition:background .15s;
  }
  .tab:nth-child(even){transform:rotate(.6deg);}
  .tab .dot{width:10px;height:10px;border-radius:50%;background:var(--c);}
  .tab.active{background:var(--c);color:#FFFDF7;border-style:solid;}
  .tab.active .dot{background:#FFFDF7;}
  .tab:focus-visible{outline:3px solid var(--c);outline-offset:2px;}
  #map{flex:1;min-height:0;z-index:1;border-top:1.5px dashed var(--line);}
  .leaflet-tile{filter:sepia(.28) saturate(.82) brightness(1.03);}
  .pin{
    width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
    background:var(--c);border:2.5px solid #FFFDF7;
    box-shadow:0 2px 6px rgba(67,48,31,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .pin span{transform:rotate(45deg);color:#FFFDF7;font-weight:800;font-size:.8rem;
    font-family:"Quicksand",sans-serif;}
  .dotpin{width:13px;height:13px;border-radius:50%;background:var(--c);
    border:2px solid #FFFDF7;box-shadow:0 1px 3px rgba(67,48,31,.35);}
  .leaflet-popup-content-wrapper{
    background:var(--card);border-radius:12px;
    border:1.5px dashed var(--pc,var(--soft));
    box-shadow:0 4px 14px rgba(67,48,31,.18);
  }
  .leaflet-popup-tip{background:var(--card);}
  .leaflet-popup-content{font-family:"Quicksand",sans-serif;margin:12px 14px;color:var(--ink);}
  .pop-time{font-weight:800;font-size:.75rem;color:var(--pc,var(--ink));letter-spacing:.03em;}
  .pop-name{font-family:"Caveat",cursive;font-weight:700;font-size:1.35rem;line-height:1.05;margin:2px 0 4px;}
  .pop-why{font-size:.82rem;line-height:1.4;font-style:italic;color:var(--ink);margin-bottom:3px;}
  .pop-note{font-size:.8rem;line-height:1.4;color:var(--soft);}
  .pop-lf{font-size:.78rem;line-height:1.4;margin-top:5px;color:var(--ink);
    background:var(--paper);border-radius:8px;padding:6px 8px;}
  .pop-book{display:inline-block;margin-top:6px;font-size:.7rem;font-weight:800;
    background:#F6E3B4;color:#7A5200;border-radius:6px;padding:2px 8px;transform:rotate(-1.5deg);}
  .pop-dir{display:inline-block;margin-top:8px;font-size:.8rem;font-weight:700;
    color:var(--pc,var(--soft));text-decoration:underline dotted;}

  /* ---- bottom sheet ---- */
  .sheet{
    background:var(--card);border-top:1.5px dashed var(--line);
    max-height:38dvh;display:flex;flex-direction:column;
    transition:max-height .25s ease;z-index:1100;position:relative;
  }
  .sheet::before{ /* washi tape */
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-1.5deg);
    width:96px;height:18px;background:var(--c);opacity:.45;border-radius:2px;
  }
  .sheet.collapsed{max-height:56px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 8px;cursor:pointer;flex:0 0 auto;gap:8px;}
  .sheet-head h2{font-family:"Caveat",cursive;font-weight:700;font-size:1.35rem;
    display:flex;align-items:center;gap:8px;line-height:1;}
  .sheet-head h2 .dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:0 0 auto;}
  .sheet-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .route-link{font-size:.74rem;font-weight:800;color:#FFFDF7;background:var(--c);
    border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap;}
  .chev{border:none;background:none;font-size:1rem;cursor:pointer;color:var(--ink);padding:4px;}
  .stops{overflow-y:auto;overflow-anchor:none;padding:0 10px 14px;}

  /* ---- one row per stop ---- */
  .stop{display:flex;gap:10px;align-items:flex-start;width:100%;
    border:none;border-bottom:1.5px dashed var(--line);
    background:none;text-align:left;font:inherit;color:inherit;
    padding:10px 8px;cursor:pointer;}
  .stop:last-child{border-bottom:none;}
  .stop:active{background:var(--paper);}
  .stop .num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;
    background:var(--c);color:#FFFDF7;font-weight:800;font-size:.75rem;
    display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .stop .t{flex:0 0 46px;font-weight:800;font-size:.8rem;padding-top:3px;color:var(--soft);}
  .stop .n{font-weight:700;font-size:.88rem;}
  .stop .w{font-size:.77rem;font-style:italic;line-height:1.35;margin:1px 0;}
  .stop .d{font-size:.76rem;color:var(--soft);line-height:1.35;}
  .stop .b{font-size:.66rem;font-weight:800;color:#7A5200;background:#F6E3B4;
    border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:1px;}

  /* ---- overview: one card per day ---- */
  .daycard{display:flex;gap:11px;align-items:flex-start;width:100%;
    border:none;border-bottom:1.5px dashed var(--line);
    background:none;text-align:left;font:inherit;color:inherit;
    padding:11px 8px;cursor:pointer;}
  .daycard:last-child{border-bottom:none;}
  .daycard:active{background:var(--paper);}
  .daycard .badge{flex:0 0 auto;width:28px;height:28px;border-radius:9px;
    background:var(--c);color:#FFFDF7;font-weight:800;font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-2.5deg);margin-top:1px;}
  .daycard .dname{font-family:"Caveat",cursive;font-weight:700;
    font-size:1.2rem;line-height:1.1;color:var(--c);}
  .daycard .dsum{font-size:.79rem;font-style:italic;line-height:1.35;margin:1px 0;}
  .daycard .dmeta{font-size:.72rem;color:var(--soft);line-height:1.35;}
  .daycard .go{margin-left:auto;align-self:center;flex:0 0 auto;
    font-size:1.1rem;font-weight:700;color:var(--c);padding-left:4px;}

  @media (min-width:760px){
    body{flex-direction:row;flex-wrap:wrap;}
    header,.tabs{width:100%;}
    .tabs{justify-content:center;}
    #map{height:auto;}
    .sheet{width:350px;max-height:none;border-top:none;border-left:1.5px dashed var(--line);}
    .sheet.collapsed{max-height:none;}
    .chev{display:none;}
  }
  @media (prefers-reduced-motion:reduce){.sheet{transition:none;}}

  /* ---- notes page (the FAQ) ---- */
  #faq{
    position:fixed;inset:0;z-index:2500;background:var(--paper);
    display:none;flex-direction:column;overflow-y:auto;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  }
  #faq.show{display:flex;}
  #faq h2{
    font-family:"Caveat",cursive;font-weight:700;font-size:2rem;
    text-align:center;line-height:1.1;
  }
  #faq .sub{text-align:center;font-size:.8rem;color:var(--soft);margin:4px 0 16px;}
  .qa{margin:0 0 22px;}
  .qa h3{
    font-family:"Caveat",cursive;font-weight:700;font-size:1.6rem;line-height:1.15;
    margin-bottom:5px;
  }
  .qa p{font-size:.88rem;line-height:1.6;margin-bottom:9px;}
  .qa p:last-child{margin-bottom:0;}
  .qa + .qa{border-top:1.5px dashed var(--line);padding-top:18px;}
  .say{margin:0 0 10px;font-size:.88rem;line-height:1.5;}
  .say .nl{font-family:"Caveat",cursive;font-weight:700;font-size:1.3rem;display:block;}
  .say .sd{color:var(--soft);font-size:.8rem;}
  #toMap{
    display:block;margin:10px auto 0;font:inherit;font-weight:700;font-size:.92rem;
    color:#FFFDF7;background:var(--accent,#C94F4F);border:none;border-radius:999px;
    padding:12px 26px;cursor:pointer;
  }
  #faqBtn{
    position:absolute;top:12px;right:14px;z-index:5;
    width:30px;height:30px;border-radius:50%;
    border:1.5px dashed var(--soft);background:var(--card);color:var(--soft);
    font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;
  }

  /* ---- cover page ---- */
  #cover{
    position:fixed;inset:0;z-index:3000;overflow:hidden;
    background:#2b1c10 url("cover.jpg") center/cover no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(26px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
    transition:opacity .6s ease;
  }
  #cover.gone{opacity:0;pointer-events:none;}
  #cover::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(43,28,16,.35) 0%, rgba(43,28,16,0) 30%),
               linear-gradient(to top, rgba(43,28,16,.55) 0%, rgba(43,28,16,0) 22%);
  }
  .cover-inner{position:relative;z-index:2;text-align:center;width:100%;}
  #brushTitle{
    color:#FFF7EB;
    text-shadow:0 2px 14px rgba(43,28,16,.7);
    min-height:4.6em;
  }
  #brushTitle .line{display:block;white-space:nowrap;}
  #brushTitle .line1{
    font-family:"Caveat",cursive;font-weight:700;
    font-size:clamp(1.6rem,6.5vw,2.4rem);line-height:1.15;
  }
  #brushTitle .line2{
    font-family:"Great Vibes","Caveat",cursive;font-weight:400;
    font-size:clamp(3rem,14vw,4.6rem);line-height:1.1;
    margin-top:2px;
  }
  #brushTitle .ch{
    display:inline-block;opacity:0;
    filter:blur(5px);transform:translateY(8px) rotate(-4deg) scale(1.12);
  }
  #brushTitle .ch.on{animation:brush .38s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes brush{
    60%{opacity:1;filter:blur(1px);transform:translateY(-1px) rotate(1.5deg) scale(1.03);}
    100%{opacity:1;filter:blur(0);transform:none;}
  }
  #stamp{
    display:inline-block;margin-top:14px;
    font-family:"Quicksand",sans-serif;font-weight:800;letter-spacing:.22em;
    font-size:1rem;color:#E24B4B;
    border:3px double #E24B4B;border-radius:8px;
    padding:7px 16px 7px 19px;
    transform:rotate(-7deg) scale(3);opacity:0;
    mix-blend-mode:screen;
    text-shadow:0 0 1px #E24B4B;
    background:rgba(255,247,235,.12);
  }
  #stamp.on{animation:thud .45s cubic-bezier(.25,1.3,.4,1) forwards;}
  @keyframes thud{to{opacity:.94;transform:rotate(-7deg) scale(1);}}
  .cover-foot{position:relative;z-index:2;text-align:center;width:100%;}
  #enter{
    display:block;margin:0 auto;font:inherit;font-weight:700;font-size:.92rem;
    color:#FFF7EB;background:rgba(255,247,235,.16);
    border:1.5px dashed rgba(255,247,235,.75);border-radius:999px;
    padding:11px 24px;cursor:pointer;opacity:0;transition:opacity .5s ease .2s;
    backdrop-filter:blur(3px);
  }
  #enter.on{opacity:1;}
  #enter:focus-visible{outline:3px solid #FFF7EB;outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){
    #brushTitle .ch{opacity:1;filter:none;transform:none;animation:none!important;}
    #stamp{animation:none!important;}
    #stamp.on{opacity:.94;transform:rotate(-7deg) scale(1);}
    #cover{transition:none;}
  }
</style>
</head>
<body>

<div id="cover" role="dialog" aria-label="Welcome page">
  <div class="cover-inner">
    <h1 id="brushTitle"></h1>
    <span id="stamp"></span>
  </div>
  <div class="cover-foot">
    <button id="enter"></button>
  </div>
</div>

<header>
  <button id="faqBtn">?</button>
  <h1 id="headerLine"></h1>
  <p id="headerSub"></p>
</header>

<div id="faq" role="dialog"></div>

<div class="tabs" id="tabs" role="tablist"></div>
<div id="map" role="application" aria-label="Itinerary map"></div>

<section class="sheet" id="sheet">
  <div class="sheet-head" id="sheetHead">
    <h2 id="sheetTitle"><span class="dot"></span><span id="sheetName"></span></h2>
    <div class="sheet-actions">
      <a class="route-link" id="routeLink" target="_blank" rel="noopener">full route ↗</a>
      <button class="chev" id="chev" aria-label="Expand or collapse timeline">▾</button>
    </div>
  </div>
  <div class="stops" id="stops"></div>
</section>

<script>
/* ===========================================================================
   TRIP:DATA:START
   Everything below this marker is content. Everything after TRIP:DATA:END is
   the engine and is identical across every trip, so never edit it by hand.
   Run  node tools/check-trip.mjs  after changing this block.
   =========================================================================== */
const TRIP = {
  // Canonical deployed URL. Link previews need absolute URLs, so this must be
  // the real one before you share the link anywhere.
  url: "https://example.vercel.app/",

  // Browser tab title.
  title: "Somewhere, a little adventure for two",

  // The strip above the tabs.
  header: {
    line: "Somewhere ♥ 1–2 Jan",   // the ♥ (or any char in `accent`) is coloured
    accent: "♥",
    color: "#C94F4F",
    sub: "a two-day wander, tap a day to dive in ♪"
  },

  // The full-screen cover. The photo is always the file `cover.jpg` next to
  // this one; swap that file to change it.
  cover: {
    line1: "Our",                  // small handwritten line
    line2: "Trip",                 // big script line
    stamp: "PART 1",               // the rubber stamp, omit to hide it
    cta: "Start your journey ›"
  },

  // What people see when the link is pasted into a chat. Run
  // tools/sync-meta.mjs to push these into the <head>, which is the only copy
  // that scrapers read.
  share: {
    title: "Our Trip",
    description: "A two-day trip, day by day on the map.",
    imageAlt: "The cover photo of our trip"
  },

  // The all-days tab.
  overview: {
    tab: "All days ♥",
    title: "Both days",
    color: "#8A7256"
  },

  // The notes page. Shown once on entry, and reachable after that from the "?"
  // in the header. Set `enabled: false` to drop it entirely.
  faq: {
    enabled: true,
    showOnEntry: true,
    label: "Trip notes",           // the "?" button's aria-label
    title: "Before you wander...",
    sub: "a few things worth knowing",
    cta: "on to the map ›",
    sections: [
      {
        q: "Why this place?",
        a: [
          "One or two paragraphs of context. Keep it to the kind of thing that",
          "makes you look at the place differently when you are standing in it."
        ]
      },
      {
        q: "How do we say hello?",
        a: ["A line of intro before the phrase list."],
        phrases: [
          { w: "Hallo", s: '"HA-loh" · hi, the one you will hear most' },
          { w: "Dank je", s: '"DANK yuh" · thanks' }
        ],
        after: ["An optional closing paragraph after the phrases."]
      }
    ]
  },

  // The itinerary. One object per day, in order.
  //
  //   name    tab label, keep it short
  //   full    the line that appears over the timeline
  //   color   this day's colour, used for the route, pins and tab
  //   extras  true turns the day into an unordered pick-and-choose list:
  //           no route line, no "full route" link, emoji badges instead of
  //           numbers. Put these days last.
  //   stops   in order. Fields:
  //             t     time label ("09:30"), or a category word on extras days
  //             n     name, keep it short enough for a tab-width row
  //             d     the practical note: booking, walking time, closing time
  //             why   one italic line on why it is worth the detour (optional)
  //             q     Google Maps search string, as specific as you can
  //             lat   decimal degrees
  //             lng   decimal degrees
  //             book  true adds a "book" badge (optional)
  //             e     emoji badge replacing the number, for extras (optional)
  //             lf    a "look for this" line inside the popup (optional)
  //             away  true keeps this stop out of the map's auto-zoom, for a
  //                   home airport or a departure station far from everything
  //                   else (optional)
  days: [
    {
      name: "Day 1: Sat", full: "Saturday, getting our bearings", color: "#C94F4F",
      stops: [
        { t:"08:30", n:"Home station", d:"Train leaves 09:02", q:"King's Cross station London", lat:51.5308, lng:-0.1238, away:true },
        { t:"11:00", n:"The old square", d:"Drop bags first, 5-min walk", q:"Grote Markt Haarlem", why:"The whole town grew outwards from this one cobbled rectangle", lat:52.3814, lng:4.6367 },
        { t:"13:00", n:"Lunch somewhere slow", d:"No bookings, go early", q:"Jopenkerk Haarlem", why:"A brewery inside a deconsecrated church, which is exactly as odd as it sounds", lat:52.3806, lng:4.6322, book:true }
      ]
    },
    {
      name: "Day 2: Sun", full: "Sunday, water and home", color: "#4A7BA6",
      stops: [
        { t:"09:30", n:"The long walk", d:"Along the river, about an hour", q:"Spaarne river Haarlem", why:"Flat, quiet and lined with houseboats", lat:52.3790, lng:4.6400 },
        { t:"15:00", n:"Back to the station", d:"Trains every 15 min", q:"Haarlem station", lat:52.3878, lng:4.6383 }
      ]
    },
    {
      name: "Extras ♡", full: "in case you are in the area", color: "#B85F9E", extras: true,
      stops: [
        { t:"eat", e:"🍴", n:"The backup lunch", d:"Near the square", q:"Lunchroom Haarlem", why:"For when the first choice has a queue out the door", lat:52.3810, lng:4.6350 },
        { t:"photo", e:"📷", n:"The bridge view", d:"Best around sunset", q:"Gravestenenbrug Haarlem", why:"The drawbridge everyone photographs, and rightly so", lat:52.3817, lng:4.6417 }
      ]
    }
  ]
};
/* TRIP:DATA:END ============================================================ */


/* ---------------------------------------------------------------------------
   Engine. Identical across trips. If you find yourself editing below this
   line for one trip, that is a sign the TRIP schema is missing a field:
   add it here and in every trip, rather than forking the engine.
   --------------------------------------------------------------------------- */

const DAYS = TRIP.days;
const ROUTE_DAYS = DAYS.map((day,i)=>({day,i})).filter(o=>!o.day.extras);
const OVERVIEW_COLOR = TRIP.overview.color;

const map = L.map('map',{zoomControl:false});
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; OpenStreetMap'
}).addTo(map);

let layer = L.layerGroup().addTo(map);
let markers = [];

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function gmapsPlace(q){
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}
function gmapsRoute(day){
  const pts = day.stops.map(s=>`${s.lat},${s.lng}`).join('/');
  return `https://www.google.com/maps/dir/${pts}`;
}
function setActiveTab(view){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
}
function dayRange(day){
  const times = day.stops.map(s=>s.t).filter(t=>/^\d/.test(t));
  return times.length ? `${times[0]} – ${times[times.length-1]}` : '';
}
// Stops marked `away` sit far from everything else, so including them would
// zoom the map out until the real route is a smudge.
function focusPoints(stops){
  const near = stops.filter(s=>!s.away);
  return (near.length ? near : stops).map(s=>[s.lat,s.lng]);
}

/* ---- the all-days overview ---- */
function showOverview(){
  setActiveTab('all');
  document.getElementById('sheetName').textContent = TRIP.overview.title;
  document.querySelector('#sheetTitle .dot').style.background = OVERVIEW_COLOR;
  document.getElementById('sheet').style.setProperty('--c', OVERVIEW_COLOR);
  document.getElementById('routeLink').style.display = 'none';

  layer.clearLayers();
  markers = [];
  const bounds = [];

  ROUTE_DAYS.forEach(({day,i},pos)=>{
    L.polyline(day.stops.map(s=>[s.lat,s.lng]),
      {color:day.color,weight:3,dashArray:'2 9',opacity:.75})
      .addTo(layer)
      .on('click',()=>showDay(i));

    // badge the first stop that is actually in the main area, so it sits in view
    const labelIdx = Math.max(day.stops.findIndex(s=>!s.away), 0);

    day.stops.forEach((s,idx)=>{
      const icon = idx===labelIdx
        ? L.divIcon({className:'', html:`<div class="pin" style="--c:${day.color}"><span>${pos+1}</span></div>`,
            iconSize:[30,30], iconAnchor:[15,28]})
        : L.divIcon({className:'', html:`<div class="dotpin" style="--c:${day.color}"></div>`,
            iconSize:[13,13], iconAnchor:[6,6]});
      L.marker([s.lat,s.lng],{icon, title:`${day.name} · ${s.n}`})
        .addTo(layer)
        .on('click',()=>showDay(i));
      if(!s.away) bounds.push([s.lat,s.lng]);
    });
  });

  map.fitBounds(L.latLngBounds(bounds).pad(0.15));

  const list = document.getElementById('stops');
  list.innerHTML = '';
  ROUTE_DAYS.forEach(({day,i},pos)=>{
    const b = document.createElement('button');
    b.className = 'daycard';
    b.style.setProperty('--c', day.color);
    b.innerHTML = `<span class="badge">${pos+1}</span>
      <span><span class="dname">${esc(day.name)}</span>
      <div class="dsum">${esc(day.full)}</div>
      <div class="dmeta">${day.stops.length} stops · ${dayRange(day)}</div></span>
      <span class="go" aria-hidden="true">›</span>`;
    b.addEventListener('click',()=>showDay(i));
    list.appendChild(b);
  });

  resetScroll(list);
}

/* ---- a single day ---- */
function showDay(i){
  const day = DAYS[i];
  setActiveTab(String(i));
  document.getElementById('sheetName').textContent = day.full;
  document.querySelector('#sheetTitle .dot').style.background = day.color;
  document.getElementById('sheet').style.setProperty('--c', day.color);
  const rl = document.getElementById('routeLink');
  rl.href = gmapsRoute(day);
  rl.style.background = day.color;
  rl.style.display = day.extras ? 'none' : '';

  layer.clearLayers();
  markers = [];

  if(!day.extras){
    L.polyline(day.stops.map(s=>[s.lat,s.lng]),
      {color:day.color,weight:3,dashArray:'2 9',opacity:.8}).addTo(layer);
  }

  day.stops.forEach((s,idx)=>{
    const badge = s.e || (idx+1);
    const icon = L.divIcon({
      className:'',
      html:`<div class="pin" style="--c:${day.color}"><span>${badge}</span></div>`,
      iconSize:[30,30], iconAnchor:[15,28], popupAnchor:[0,-26]
    });
    const m = L.marker([s.lat,s.lng],{icon}).addTo(layer);
    m.bindPopup(
      `<div style="--pc:${day.color}">
        <div class="pop-time">${esc(s.t)}</div>
        <div class="pop-name">${badge}. ${esc(s.n)}</div>
        ${s.why?`<div class="pop-why">${esc(s.why)}</div>`:''}
        <div class="pop-note">${esc(s.d)}</div>
        ${s.lf?`<div class="pop-lf">👀 ${esc(s.lf)}</div>`:''}
        ${s.book?'<span class="pop-book">book ahead ♡</span>':''}
        <br><a class="pop-dir" href="${gmapsPlace(s.q)}" target="_blank" rel="noopener">open in Google Maps ↗</a>
      </div>`,
      {autoPanPaddingTopLeft:[20,72], autoPanPaddingBottomRight:[20,20]}
    );
    markers.push(m);
  });

  map.fitBounds(L.latLngBounds(focusPoints(day.stops)).pad(0.18));

  const list = document.getElementById('stops');
  list.innerHTML = '';
  day.stops.forEach((s,idx)=>{
    const b = document.createElement('button');
    b.className = 'stop';
    b.style.setProperty('--c', day.color);
    b.innerHTML = `<span class="num">${s.e || (idx+1)}</span>
      <span class="t">${esc(s.t)}</span>
      <span><span class="n">${esc(s.n)}</span>${s.book?'<span class="b">book</span>':''}
      ${s.why?`<div class="w">${esc(s.why)}</div>`:''}
      <div class="d">${esc(s.d)}</div></span>`;
    b.addEventListener('click',()=>{
      const z = Math.max(map.getZoom(),15);
      // aim below centre so the popup above the pin stays fully visible
      const pt = map.project([s.lat,s.lng], z).subtract([0, 105]);
      map.once('moveend',()=>markers[idx].openPopup());
      map.flyTo(map.unproject(pt, z), z, {duration:.5});
    });
    list.appendChild(b);
  });

  resetScroll(list);
}

// Rebuilding the list does not move the scrollbar, and scroll anchoring will
// put it back where it was. Both lines are needed.
function resetScroll(list){
  list.scrollTop = 0;
  requestAnimationFrame(()=>{ list.scrollTop = 0; });
}

/* ---- chrome built from TRIP ---- */
(function buildChrome(){
  document.documentElement.style.setProperty('--accent', TRIP.header.color);
  document.getElementById('headerLine').innerHTML =
    esc(TRIP.header.line).split(esc(TRIP.header.accent))
      .join(`<span class="heart">${esc(TRIP.header.accent)}</span>`);
  document.getElementById('headerSub').textContent = TRIP.header.sub;

  const tabs = document.getElementById('tabs');
  const allTab = document.createElement('button');
  allTab.className = 'tab';
  allTab.setAttribute('role','tab');
  allTab.dataset.view = 'all';
  allTab.style.setProperty('--c', OVERVIEW_COLOR);
  allTab.innerHTML = `<span class="dot"></span>${esc(TRIP.overview.tab)}`;
  allTab.addEventListener('click', showOverview);
  tabs.appendChild(allTab);

  DAYS.forEach((d,i)=>{
    const b = document.createElement('button');
    b.className = 'tab';
    b.setAttribute('role','tab');
    b.dataset.view = String(i);
    b.style.setProperty('--c', d.color);
    b.innerHTML = `<span class="dot"></span>${esc(d.name)}`;
    b.addEventListener('click',()=>showDay(i));
    tabs.appendChild(b);
  });

  const sheet = document.getElementById('sheet');
  document.getElementById('sheetHead').addEventListener('click',(e)=>{
    if(e.target.id==='routeLink') return;
    sheet.classList.toggle('collapsed');
    document.getElementById('chev').textContent = sheet.classList.contains('collapsed')?'▴':'▾';
  });
})();

/* ---- the notes page ---- */
(function buildFaq(){
  const faq = document.getElementById('faq');
  const btn = document.getElementById('faqBtn');
  if(!TRIP.faq || !TRIP.faq.enabled){
    faq.remove(); btn.remove();
    return;
  }
  faq.setAttribute('aria-label', TRIP.faq.label);
  btn.setAttribute('aria-label', TRIP.faq.label);

  const parts = [
    `<h2>${esc(TRIP.faq.title)}</h2>`,
    `<p class="sub">${esc(TRIP.faq.sub)}</p>`
  ];
  TRIP.faq.sections.forEach(sec=>{
    const body = [
      ...(sec.a||[]).map(p=>`<p>${esc(p)}</p>`),
      ...(sec.phrases||[]).map(p=>
        `<p class="say"><span class="nl">${esc(p.w)}</span><span class="sd">${esc(p.s)}</span></p>`),
      ...(sec.after||[]).map(p=>`<p>${esc(p)}</p>`)
    ].join('\n');
    parts.push(`<section class="qa"><h3>${esc(sec.q)}</h3>\n${body}\n</section>`);
  });
  parts.push(`<button id="toMap">${esc(TRIP.faq.cta)}</button>`);
  faq.innerHTML = parts.join('\n');

  function open(){ faq.classList.add('show'); }
  function close(){ faq.classList.remove('show'); map.invalidateSize(); }
  document.getElementById('toMap').addEventListener('click', close);
  btn.addEventListener('click', open);
  faq.__open = open;
})();

showOverview();

/* ---- cover animation ---- */
(function cover(){
  const holder = document.getElementById('brushTitle');
  const stamp = document.getElementById('stamp');
  const enter = document.getElementById('enter');
  const el = document.getElementById('cover');
  const faq = document.getElementById('faq');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  holder.setAttribute('aria-label', `${TRIP.cover.line1} ${TRIP.cover.line2}`);
  enter.textContent = TRIP.cover.cta;
  if(TRIP.cover.stamp){ stamp.textContent = TRIP.cover.stamp; } else { stamp.remove(); }

  [TRIP.cover.line1, TRIP.cover.line2].forEach((line,li)=>{
    const row = document.createElement('span');
    row.className = 'line line'+(li+1);
    line.split('').forEach(c=>{
      const sp = document.createElement('span');
      sp.className = 'ch';
      sp.setAttribute('aria-hidden','true');
      sp.innerHTML = c===' ' ? '&nbsp;' : esc(c);
      row.appendChild(sp);
    });
    holder.appendChild(row);
  });
  const chars = [...holder.querySelectorAll('.ch')];

  function finish(){
    if(TRIP.cover.stamp) stamp.classList.add('on');
    setTimeout(()=>enter.classList.add('on'), 350);
  }
  if(reduced){ chars.forEach(c=>c.classList.add('on')); finish(); }
  else{
    chars.forEach((c,i)=> setTimeout(()=>c.classList.add('on'), 350 + i*85));
    setTimeout(finish, 350 + chars.length*85 + 250);
  }

  enter.addEventListener('click',()=>{
    el.classList.add('gone');
    if(faq && TRIP.faq.showOnEntry) faq.__open();
    setTimeout(()=>{
      el.remove();
      // the map was sized behind a full-screen cover, so it needs re-measuring
      if(!faq || !TRIP.faq.showOnEntry) map.invalidateSize();
    }, 650);
  });
})();
</script>
